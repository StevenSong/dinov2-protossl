[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "protossl-rad"
version = "0.1.0"
description = "Radiology imaging datasets and ProtoViT-style prototype layers shared by ProtoSSL pretraining (DINOv2 fork) and downstream repos"
requires-python = ">=3.10"
# kept separate from the dinov2 setup.py so other repos can install this without dinov2's pinned torch/xformers
dependencies = ["torch", "numpy", "pandas", "pillow", "tqdm"]

[project.optional-dependencies]
dicom = ["pydicom", "pylibjpeg", "pylibjpeg-openjpeg"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["protossl_rad*"]
